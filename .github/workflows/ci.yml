name: Intégration continue

# Vérifie à chaque évolution que le code compile, respecte les règles de style
# et que les calculs financiers restent justes.
on:
  push:
    branches: [main, 'feat/**', 'chore/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  verifier:
    name: Lint, typage et tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Vérifier le style
        run: npm run lint

      - name: Vérifier le typage
        run: npm run typecheck

      - name: Lancer les tests
        run: npm test
