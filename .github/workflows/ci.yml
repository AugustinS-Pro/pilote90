name: Intégration continue

# Vérifie à chaque évolution que le code compile, respecte les règles de style
# et que les calculs financiers restent justes.
on:
  push:
    branches: [main, 'feat/**', 'chore/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  verifier:
    name: Lint, typage et tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Vérifier le style
        run: npm run lint

      - name: Vérifier le typage
        run: npm run typecheck

      - name: Lancer les tests
        run: npm test

      # La construction est la seule etape qui detecte un module client
      # importe depuis un composant serveur : ni le lint ni le typage ne
      # le voient. Le projet a paye cette erreur trois fois.
      - name: Construire l'application
        run: npm run build
        env:
          DATABASE_URL: postgresql://x:x@localhost:5432/x
          DIRECT_URL: postgresql://x:x@localhost:5432/x
          NEXTAUTH_SECRET: construction-uniquement

