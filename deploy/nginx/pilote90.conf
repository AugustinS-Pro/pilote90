# Pilote90 — reverse proxy et terminaison TLS.
# Remplacez pilote90.exemple.fr par votre nom de domaine reel.

# Redirection permanente vers HTTPS, sauf pour la validation Let's Encrypt.
server {
    listen 80;
    listen [::]:80;
    server_name pilote90.exemple.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pilote90.exemple.fr;

    ssl_certificate     /etc/letsencrypt/live/pilote90.exemple.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pilote90.exemple.fr/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- En-tetes de securite ------------------------------------------------
    # HSTS : le navigateur refusera toute connexion non chiffree pendant un an.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # La version de nginx n'a pas a etre annoncee.
    server_tokens off;

    client_max_body_size 10M;

    # --- Limitation de debit sur la connexion --------------------------------
    # Freine les tentatives repetees sur le formulaire d'authentification.
    location /api/auth/callback/credentials {
        limit_req zone=connexion burst=5 nodelay;
        proxy_pass http://app:3000;
        include /etc/nginx/conf.d/proxy-commun.inc;
    }

    # --- Fichiers statiques : cache long, ils sont versionnes par leur nom ----
    location /_next/static/ {
        proxy_pass http://app:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/proxy-commun.inc;
    }

    location / {
        proxy_pass http://app:3000;
        include /etc/nginx/conf.d/proxy-commun.inc;
    }
}
